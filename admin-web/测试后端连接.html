<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>后端连接测试</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 800px;
            margin: 50px auto;
            padding: 20px;
            background: #f5f5f5;
        }
        .test-card {
            background: white;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            margin-bottom: 20px;
        }
        h1 {
            color: #667eea;
            text-align: center;
        }
        button {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 16px;
            margin: 10px 5px;
        }
        button:hover {
            opacity: 0.9;
        }
        .result {
            margin-top: 20px;
            padding: 15px;
            border-radius: 6px;
            font-family: monospace;
            white-space: pre-wrap;
            word-wrap: break-word;
        }
        .success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }
        .error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }
        .info {
            background: #d1ecf1;
            color: #0c5460;
            border: 1px solid #bee5eb;
        }
    </style>
</head>
<body>
    <h1>🔍 阳光披萨后端连接测试</h1>
    
    <div class="test-card">
        <h2>测试 1: 根路径测试</h2>
        <button onclick="testRoot()">测试根路径</button>
        <div id="rootResult"></div>
    </div>

    <div class="test-card">
        <h2>测试 2: 登录 API 测试</h2>
        <button onclick="testLogin()">测试登录接口</button>
        <div id="loginResult"></div>
    </div>

    <div class="test-card">
        <h2>测试 3: 获取用户列表（需要先登录）</h2>
        <button onclick="testUsers()">测试用户列表</button>
        <div id="usersResult"></div>
    </div>

    <div class="test-card">
        <h2>📋 系统信息</h2>
        <div id="sysInfo" class="result info"></div>
    </div>

    <script>
        const API_BASE = 'http://118.89.73.199:5000';
        let token = null;

        // 显示系统信息
        document.getElementById('sysInfo').textContent = 
            `浏览器: ${navigator.userAgent}\n` +
            `当前时间: ${new Date().toLocaleString('zh-CN')}\n` +
            `API 地址: ${API_BASE}`;

        // 测试根路径
        async function testRoot() {
            const resultDiv = document.getElementById('rootResult');
            resultDiv.innerHTML = '<div class="result info">⏳ 测试中...</div>';
            
            try {
                console.log('🔍 测试根路径:', API_BASE);
                const response = await fetch(API_BASE);
                const text = await response.text();
                
                resultDiv.innerHTML = `
                    <div class="result success">
                        ✅ 连接成功！
                        状态码: ${response.status}
                        响应: ${text}
                    </div>
                `;
                console.log('✅ 根路径测试成功:', text);
            } catch (error) {
                resultDiv.innerHTML = `
                    <div class="result error">
                        ❌ 连接失败！
                        错误: ${error.message}
                        
                        可能原因:
                        1. 后端服务未运行
                        2. 网络连接问题
                        3. 防火墙阻止
                    </div>
                `;
                console.error('❌ 根路径测试失败:', error);
            }
        }

        // 测试登录
        async function testLogin() {
            const resultDiv = document.getElementById('loginResult');
            resultDiv.innerHTML = '<div class="result info">⏳ 登录中...</div>';
            
            try {
                console.log('🔐 测试登录接口');
                const response = await fetch(`${API_BASE}/api/auth/login`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        username: 'admin',
                        password: 'admin123'
                    })
                });
                
                const data = await response.json();
                console.log('📥 登录响应:', data);
                
                if (response.ok && data.code === 200) {
                    token = data.data.token;
                    resultDiv.innerHTML = `
                        <div class="result success">
                            ✅ 登录成功！
                            
                            Token: ${token.substring(0, 50)}...
                            
                            用户信息:
                            ${JSON.stringify(data.data.user, null, 2)}
                        </div>
                    `;
                } else {
                    resultDiv.innerHTML = `
                        <div class="result error">
                            ❌ 登录失败！
                            ${JSON.stringify(data, null, 2)}
                        </div>
                    `;
                }
            } catch (error) {
                resultDiv.innerHTML = `
                    <div class="result error">
                        ❌ 登录请求失败！
                        错误: ${error.message}
                    </div>
                `;
                console.error('❌ 登录失败:', error);
            }
        }

        // 测试用户列表
        async function testUsers() {
            const resultDiv = document.getElementById('usersResult');
            
            if (!token) {
                resultDiv.innerHTML = `
                    <div class="result error">
                        ⚠️ 请先测试登录接口获取 Token
                    </div>
                `;
                return;
            }
            
            resultDiv.innerHTML = '<div class="result info">⏳ 加载中...</div>';
            
            try {
                console.log('📋 测试用户列表接口');
                const response = await fetch(`${API_BASE}/api/users/?page=1&per_page=5`, {
                    headers: {
                        'Authorization': `Bearer ${token}`
                    }
                });
                
                const data = await response.json();
                console.log('📥 用户列表响应:', data);
                
                if (response.ok && data.code === 200) {
                    resultDiv.innerHTML = `
                        <div class="result success">
                            ✅ 获取用户列表成功！
                            
                            总数: ${data.data.total}
                            当前页: ${data.data.page}
                            
                            用户列表:
                            ${JSON.stringify(data.data.items, null, 2)}
                        </div>
                    `;
                } else {
                    resultDiv.innerHTML = `
                        <div class="result error">
                            ❌ 获取失败！
                            ${JSON.stringify(data, null, 2)}
                        </div>
                    `;
                }
            } catch (error) {
                resultDiv.innerHTML = `
                    <div class="result error">
                        ❌ 请求失败！
                        错误: ${error.message}
                    </div>
                `;
                console.error('❌ 用户列表失败:', error);
            }
        }

        // 页面加载时自动测试根路径
        window.onload = function() {
            console.log('🚀 页面加载完成，开始自动测试...');
            testRoot();
        };
    </script>
</body>
</html>
