<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>后端连接测试 - 快速诊断</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            max-width: 900px;
            margin: 40px auto;
            padding: 30px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
        }
        .container {
            background: white;
            padding: 40px;
            border-radius: 16px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }
        h1 {
            color: #ff1744;
            margin-bottom: 10px;
        }
        .subtitle {
            color: #666;
            margin-bottom: 30px;
        }
        button {
            background: linear-gradient(135deg, #ff1744 0%, #d50000 100%);
            color: white;
            border: none;
            padding: 14px 28px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
            font-weight: 600;
            margin: 10px 10px 10px 0;
            transition: all 0.3s;
        }
        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 16px rgba(255, 23, 68, 0.4);
        }
        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        .result {
            margin-top: 20px;
            padding: 20px;
            border-radius: 10px;
            font-family: 'Courier New', monospace;
            white-space: pre-wrap;
            word-wrap: break-word;
            max-height: 500px;
            overflow-y: auto;
        }
        .success {
            background: #d4edda;
            color: #155724;
            border: 2px solid #c3e6cb;
        }
        .error {
            background: #f8d7da;
            color: #721c24;
            border: 2px solid #f5c6cb;
        }
        .info {
            background: #d1ecf1;
            color: #0c5460;
            border: 2px solid #bee5eb;
        }
        .warning {
            background: #fff3cd;
            color: #856404;
            border: 2px solid #ffeaa7;
        }
        .test-section {
            margin: 30px 0;
            padding: 25px;
            background: #f8f9fa;
            border-radius: 12px;
            border-left: 5px solid #ff1744;
        }
        .test-section h3 {
            margin-top: 0;
            color: #333;
        }
        .loading {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid rgba(255,23,68,.3);
            border-radius: 50%;
            border-top-color: #ff1744;
            animation: spin 1s ease-in-out infinite;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🔍 圣比萨后端连接诊断工具</h1>
        <p class="subtitle">快速测试后端服务是否正常运行</p>

        <div class="test-section">
            <h3>测试 1: 根路径访问</h3>
            <p>测试后端服务是否运行</p>
            <button onclick="testRoot()">🌐 测试根路径</button>
            <div id="rootResult"></div>
        </div>

        <div class="test-section">
            <h3>测试 2: 登录 API</h3>
            <p>测试登录接口和 CORS 配置</p>
            <button onclick="testLogin()">🔐 测试登录</button>
            <div id="loginResult"></div>
        </div>

        <div class="test-section">
            <h3>测试 3: CORS 预检请求</h3>
            <p>测试 CORS OPTIONS 请求</p>
            <button onclick="testCORS()">🔄 测试 CORS</button>
            <div id="corsResult"></div>
        </div>

        <div class="test-section">
            <h3>测试 4: 网络延迟</h3>
            <p>测试到服务器的网络延迟</p>
            <button onclick="testPing()">⚡ 测试延迟</button>
            <div id="pingResult"></div>
        </div>
    </div>

    <script>
        const API_BASE = 'http://118.89.73.199:5000';

        function showLoading(elementId) {
            document.getElementById(elementId).innerHTML = 
                '<div class="result info"><span class="loading"></span> 测试中...</div>';
        }

        async function testRoot() {
            const resultDiv = document.getElementById('rootResult');
            showLoading('rootResult');
            
            const startTime = Date.now();
            try {
                console.log('🔍 测试根路径:', API_BASE);
                const response = await fetch(API_BASE, {
                    method: 'GET',
                    mode: 'cors'
                });
                const duration = Date.now() - startTime;
                const text = await response.text();
                
                resultDiv.innerHTML = `
                    <div class="result success">
                        ✅ 连接成功！
                        
                        响应时间: ${duration}ms
                        状态码: ${response.status}
                        响应内容: ${text}
                        
                        CORS Headers:
                        ${Object.entries(response.headers).map(([k, v]) => 
                            k.toLowerCase().includes('access-control') ? `  ${k}: ${v}` : ''
                        ).filter(Boolean).join('\n') || '  (无 CORS 头)'}
                    </div>
                `;
                console.log('✅ 根路径测试成功:', text);
            } catch (error) {
                const duration = Date.now() - startTime;
                resultDiv.innerHTML = `
                    <div class="result error">
                        ❌ 连接失败！
                        
                        耗时: ${duration}ms
                        错误: ${error.message}
                        错误类型: ${error.name}
                        
                        可能原因:
                        1. 后端服务未运行
                        2. 防火墙阻止
                        3. 网络连接问题
                        4. CORS 配置错误
                        
                        解决方法:
                        - SSH 到服务器检查: sudo systemctl status sunpizza-backend
                        - 查看日志: tail -n 50 ~/SunpizzaApp/backend/logs/gunicorn_error.log
                    </div>
                `;
                console.error('❌ 根路径测试失败:', error);
            }
        }

        async function testLogin() {
            const resultDiv = document.getElementById('loginResult');
            showLoading('loginResult');
            
            const startTime = Date.now();
            try {
                console.log('🔐 测试登录接口');
                const response = await fetch(`${API_BASE}/api/auth/login`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    mode: 'cors',
                    body: JSON.stringify({
                        username: 'admin',
                        password: 'admin123'
                    })
                });
                
                const duration = Date.now() - startTime;
                const data = await response.json();
                console.log('📥 登录响应:', data);
                
                if (response.ok && data.code === 200) {
                    resultDiv.innerHTML = `
                        <div class="result success">
                            ✅ 登录成功！
                            
                            响应时间: ${duration}ms
                            状态码: ${response.status}
                            
                            Token: ${data.data.token.substring(0, 30)}...
                            
                            用户信息:
                            ${JSON.stringify(data.data.user, null, 2)}
                            
                            ✅ CORS 配置正常
                            ✅ 后端服务正常
                            ✅ 数据库连接正常
                        </div>
                    `;
                } else {
                    resultDiv.innerHTML = `
                        <div class="result warning">
                            ⚠️ 登录失败！
                            
                            响应时间: ${duration}ms
                            状态码: ${response.status}
                            
                            ${JSON.stringify(data, null, 2)}
                        </div>
                    `;
                }
            } catch (error) {
                const duration = Date.now() - startTime;
                resultDiv.innerHTML = `
                    <div class="result error">
                        ❌ 登录请求失败！
                        
                        耗时: ${duration}ms
                        错误: ${error.message}
                        错误类型: ${error.name}
                        
                        如果这里失败，说明:
                        ${error.name === 'TypeError' && error.message.includes('fetch') ? 
                          '- CORS 被浏览器阻止\n- 后端服务可能未运行\n- 网络不通' : 
                          '- 请求超时或网络错误'}
                    </div>
                `;
                console.error('❌ 登录失败:', error);
            }
        }

        async function testCORS() {
            const resultDiv = document.getElementById('corsResult');
            showLoading('corsResult');
            
            try {
                const response = await fetch(`${API_BASE}/api/auth/login`, {
                    method: 'OPTIONS',
                    headers: {
                        'Access-Control-Request-Method': 'POST',
                        'Access-Control-Request-Headers': 'Content-Type, Authorization',
                    },
                    mode: 'cors'
                });
                
                const corsHeaders = {};
                response.headers.forEach((value, key) => {
                    if (key.toLowerCase().includes('access-control')) {
                        corsHeaders[key] = value;
                    }
                });
                
                resultDiv.innerHTML = `
                    <div class="result ${Object.keys(corsHeaders).length > 0 ? 'success' : 'error'}">
                        ${Object.keys(corsHeaders).length > 0 ? '✅' : '❌'} CORS 预检测试
                        
                        状态码: ${response.status}
                        
                        CORS Headers:
                        ${JSON.stringify(corsHeaders, null, 2)}
                        
                        ${Object.keys(corsHeaders).length === 0 ? 
                          '⚠️ 后端未返回 CORS 头，需要更新后端配置' : 
                          '✅ CORS 配置正常'}
                    </div>
                `;
            } catch (error) {
                resultDiv.innerHTML = `
                    <div class="result error">
                        ❌ CORS 预检失败！
                        错误: ${error.message}
                    </div>
                `;
            }
        }

        async function testPing() {
            const resultDiv = document.getElementById('pingResult');
            showLoading('pingResult');
            
            const times = [];
            const tests = 5;
            
            for (let i = 0; i < tests; i++) {
                const start = Date.now();
                try {
                    await fetch(API_BASE, { method: 'HEAD', mode: 'no-cors' });
                    times.push(Date.now() - start);
                } catch (error) {
                    times.push(-1);
                }
            }
            
            const validTimes = times.filter(t => t > 0);
            const avg = validTimes.length > 0 ? 
                Math.round(validTimes.reduce((a, b) => a + b, 0) / validTimes.length) : -1;
            
            resultDiv.innerHTML = `
                <div class="result ${avg > 0 && avg < 1000 ? 'success' : avg > 0 ? 'warning' : 'error'}">
                    ${avg > 0 ? '✅' : '❌'} 网络延迟测试
                    
                    测试次数: ${tests}
                    成功次数: ${validTimes.length}
                    
                    各次延迟: ${times.map(t => t > 0 ? `${t}ms` : '超时').join(', ')}
                    平均延迟: ${avg > 0 ? `${avg}ms` : '无法连接'}
                    
                    评价: ${
                        avg < 0 ? '❌ 无法连接到服务器' :
                        avg < 100 ? '✅ 延迟极低，连接优秀' :
                        avg < 300 ? '✅ 延迟较低，连接良好' :
                        avg < 1000 ? '⚠️ 延迟较高，连接一般' :
                        '❌ 延迟很高，网络状况差'
                    }
                </div>
            `;
        }

        // 页面加载时自动运行所有测试
        window.onload = async function() {
            console.log('🚀 开始自动诊断...');
            await testRoot();
            await new Promise(resolve => setTimeout(resolve, 500));
            await testLogin();
            await new Promise(resolve => setTimeout(resolve, 500));
            await testCORS();
            await new Promise(resolve => setTimeout(resolve, 500));
            await testPing();
            console.log('✅ 诊断完成！');
        };
    </script>
</body>
</html>
