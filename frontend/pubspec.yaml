name: sunpizza_app
description: 圣比萨智能门店管理平台
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  
  # 状态管理
  provider: ^6.1.1
  
  # 网络请求
  dio: ^5.4.0
  
  # 本地存储
  shared_preferences: ^2.2.2
  
  # 路由导航
  go_router: ^13.0.0
  
  # JSON序列化
  json_annotation: ^4.8.1
  
  # UI组件
  flutter_screenutil: ^5.9.0
  flutter_svg: ^2.0.9
  cached_network_image: ^3.3.0
  
  # 日期时间
  intl: ^0.18.1
  
  # 图片选择
  image_picker: ^1.0.7
  
  # 文件选择
  file_picker: ^8.0.0
  
  # 权限管理
  permission_handler: ^11.2.0
  
  # 下拉刷新
  pull_to_refresh: ^2.0.0
  
  # Toast提示
  fluttertoast: ^8.2.4
  
  # 加载动画
  flutter_spinkit: ^5.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  
  flutter_lints: ^3.0.0
  build_runner: ^2.4.7
  json_serializable: ^6.7.1

flutter:
  uses-material-design: true
  
  # 资源文件
  assets:
    - assets/images/logo.png
  
  # 字体（暂时使用系统默认字体）
  # fonts:
  #   - family: PingFang
  #     fonts:
  #       - asset: assets/fonts/PingFang-Regular.ttf
